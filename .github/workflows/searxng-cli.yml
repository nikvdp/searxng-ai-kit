name: SearXNG AI Kit

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset_name: searxng-ai-kit-linux-x64
          - runner: ubuntu-24.04-arm
            asset_name: searxng-ai-kit-linux-arm64
          - runner: macos-14
            asset_name: searxng-ai-kit-macos-arm64
          - runner: windows-latest
            asset_name: searxng-ai-kit-windows-x64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build standalone binary
        id: pybin
        uses: nikvdp/setup-pybin@v1
        with:
          entrypoint: searxng
          python: "3.12"
          output: ${{ matrix.asset_name }}
          pybin-version: "v0.1.1"
          upload-artifact: "true"
          artifact-name: ${{ matrix.asset_name }}

      - name: Smoke test binary on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          executable_path="${{ steps.pybin.outputs.executable-path }}"
          case "$executable_path" in
            /*|*/*) ;;
            *) executable_path="./$executable_path" ;;
          esac

          chmod +x "$executable_path"
          "$executable_path" --help

      - name: Smoke test binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $executablePath = "${{ steps.pybin.outputs.executable-path }}"
          if (-not [System.IO.Path]::IsPathRooted($executablePath) -and $executablePath -notmatch "[/\\]") {
            $executablePath = ".\$executablePath"
          }

          & $executablePath --help

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
